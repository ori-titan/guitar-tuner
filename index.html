<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport meta makes the page scale correctly on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guitar Tuner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Guitar Tuner</h1>
    <!-- Instructions and live feedback (e.g. flat/sharp, errors); filled in by tuner.js. -->
    <p id="status" class="status">Press Start and play a string.</p>

    <!-- The note name and frequency are filled in by tuner.js. -->
    <section class="readout" aria-live="polite">
      <div id="note-name" class="note-name">--</div>
      <div id="frequency" class="frequency">0.0 Hz</div>
    </section>

    <!-- Needle moves left (flat) or right (sharp) of the centre mark. -->
    <section class="meter" aria-label="Tuning meter">
      <div class="meter-center"></div>
      <div id="needle" class="needle"></div>
    </section>
    <div class="meter-labels"><span>&flat; flat</span><span>sharp &sharp;</span></div>

    <!-- Kept high on the page so it is reachable without scrolling on small screens.
         The tuning options are filled in by tuner.js from its TUNINGS table. -->
    <div class="controls">
      <label for="tuning-select" class="tuning-label">Tuning</label>
      <select id="tuning-select"></select>
      <button id="toggle-button" type="button">Start</button>
    </div>

    <!-- Reference list of the six strings; tuner.js highlights the closest one. -->
    <ul id="string-list" class="string-list"></ul>
    <!-- Reminds the user how to leave string-lock mode; filled in by tuner.js, empty in auto mode. -->
    <p id="lock-hint" class="lock-hint"></p>

    <!-- Headstock drawing; tuner.js sets its viewBox and builds the strings and pegs inside it. -->
    <svg id="headstock" class="headstock" role="img"
         aria-label="Guitar headstock with six tuning pegs"></svg>
    <!-- Which way to turn the active peg; filled in by tuner.js. -->
    <p id="turn-hint" class="turn-hint" aria-live="polite"></p>
  </main>

  <script src="tuner.js"></script>
</body>
</html>
